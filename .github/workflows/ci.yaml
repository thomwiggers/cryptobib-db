name: CI
on:
  pull_request:
  push:
    branches: [master, monorepo]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: make
      - run: sha256sum abbrev?.bib crypto.bib crypto_crossref.bib

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra biber
      - run: make -C resources/tests/bibtex8 -f unix.mak bibtex-exe CC=gcc CFLAGS="-std=gnu17 -Wall -Wno-char-subscripts -funsigned-char" LD=gcc
      - run: uv sync --locked
      - run: make test PDFLATEX="pdflatex -interaction=nonstopmode -halt-on-error"
